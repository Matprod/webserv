<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Chunked</title>
</head>
<body>
    <button onclick="sendRequest()">Envoyer requête</button>
    <pre id="result"></pre>

    <script>
        async function sendRequest() {
            const url = 'http://localhost:3434/cgi-bin/test.py';
            const resultDiv = document.getElementById('result');

            const body = 'Hello World'; // Corps brut au lieu de chunks
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                });

                const text = await response.text();
                resultDiv.textContent = text;
            } catch (error) {
                resultDiv.textContent = 'Erreur : ' + error.message;
            }
        }
    </script>
</body>
</html>
